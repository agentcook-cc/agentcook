name: ✨ Feature Request
description: 提议一个新功能 / 改进
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你来提建议!大改(新 feature / 架构变化)建议先开 [Discussion](https://github.com/agentcook-cc/agentcook/discussions) 聊,确认方向后再开 issue。
  - type: textarea
    id: use-case
    attributes:
      label: 你想解决什么问题?
      placeholder: "我在做 X 时,目前 Y 没法做,导致 Z"
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: 你建议怎么做?
      placeholder: "可以加 X feature / API / configuration"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案?
      placeholder: "也考虑过 X / Y,各自缺点是..."
  - type: dropdown
    id: priority
    attributes:
      label: 紧急度
      options:
        - 🔴 高 (没这个我用不了)
        - 🟡 中 (没这个体验差)
        - 🟢 低 (nice to have)
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: 贡献意愿
      options:
        - label: 我愿意提 PR 实现这个 feature
        - label: 我只是建议 / 等团队实现
