name: Frontend CI

on:
  push:
    branches: [main, develop]
  workflow_call:
  pull_request:
    branches: [main]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pnpm
        run: npm install -g pnpm@9.12.0
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Run lint
        run: pnpm turbo run lint
      - name: Build and type check
        run: pnpm turbo run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pnpm
        run: npm install -g pnpm@9.12.0
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Run tests
        run: pnpm turbo run test

  e2e:
    runs-on: ubuntu-latest
    needs: [lint-and-type-check]
    timeout-minutes: 25
    services:
      postgres-business:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentcook
          POSTGRES_PASSWORD: agentcook_dev
          POSTGRES_DB: agentcook_business
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U agentcook"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SPRING_PROFILES_ACTIVE: dev
      AGENTCOOK_PY_API: http://127.0.0.1:8000
      AGENTCOOK_JAVA_API: http://127.0.0.1:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5433/agentcook_business
      SPRING_DATASOURCE_USERNAME: agentcook
      SPRING_DATASOURCE_PASSWORD: agentcook_dev
      SPRING_DATA_REDIS_HOST: 127.0.0.1
      SPRING_DATA_REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pnpm
        run: npm install -g pnpm@9.12.0

      - name: Install frontend deps
        run: pnpm install --no-frozen-lockfile && pnpm --filter @agentcook-cc/design-tokens build
      - name: Install Playwright browsers (chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup uv
        uses: astral-sh/setup-uv@v3
      - name: Install runtime dependencies
        run: uv sync --all-packages --all-extras --group dev

      - name: Build Java backend
        working-directory: agentcook-java
        run: ./mvnw -B -ntp -DskipTests package
      - name: Start Java backend
        run: |
          nohup java -jar agentcook-java/agentcook-api/target/agentcook-api-0.1.0-SNAPSHOT.jar > java-dev.log 2>&1 &
          echo $! > java-dev.pid
      - name: Wait for Java actuator/health UP
        run: |
          for i in {1..60}; do
            if curl -fs http://127.0.0.1:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo " ← Java backend UP"; exit 0
            fi
            sleep 2
          done
          echo "Java backend failed to come up in 120s" >&2
          tail -200 java-dev.log >&2 || true
          exit 1

      - name: Initialize local administrator
        run: |
          curl -fsS http://127.0.0.1:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin-password-123"}' -o /dev/null

      - name: Start both runtimes
        run: |
          AGENTCOOK_AUTH_MODE=required AGENTCOOK_JWT_ISSUER=agentcook-java \
          AGENTCOOK_JAVA_BASE_URL=http://127.0.0.1:8080 AGENTCOOK_QUOTA_ENABLED=true \
          AGENTCOOK_QUOTA_PRIMARY_PROVIDER=mock AGENTCOOK_QUOTA_PRIMARY_MODEL='' \
          AGENTCOOK_QUOTA_FALLBACK_PROVIDER=mock AGENTCOOK_QUOTA_FALLBACK_MODEL='' \
          AGENTCOOK_MOCK_DELAY_MS=20 uv run uvicorn agentcook_app.main:app --port 8000 > runtime-required.log 2>&1 &
          AGENTCOOK_AUTH_MODE=optional AGENTCOOK_MOCK_DELAY_MS=20 \
            uv run uvicorn agentcook_app.main:app --port 8001 > runtime-optional.log 2>&1 &

      - name: Start web apps
        run: |
          pnpm --filter @agentcook-cc/admin dev --port 5173 --host 127.0.0.1 > admin-dev.log 2>&1 &
          pnpm --filter @agentcook-cc/app dev --port 5174 --host 127.0.0.1 > app-dev.log 2>&1 &
          AGENTCOOK_PY_API=http://127.0.0.1:8001 \
            pnpm --filter @agentcook-cc/app dev --port 5175 --host 127.0.0.1 > app-anonymous.log 2>&1 &

      - name: Wait for runtimes and web apps
        run: |
          wait_one() {
            local url=$1
            for i in {1..30}; do
              if curl -fs "$url" >/dev/null; then
                return 0
              fi
              sleep 2
            done
            echo "$url did not become ready in 60s" >&2
            return 1
          }
          wait_one http://127.0.0.1:8000/health
          wait_one http://127.0.0.1:8001/health
          wait_one http://127.0.0.1:5173/
          wait_one http://127.0.0.1:5174/
          wait_one http://127.0.0.1:5175/

      - name: Verify Java provider contract
        env:
          AGENTCOOK_JAVA_PROVIDER_URL: http://127.0.0.1:8080
        run: uv run pytest tests/contract/test_12_provider_verify_java_local.py -q --no-cov

      - name: Run Playwright
        env:
          PLAYWRIGHT_BASE_URL_ADMIN: http://127.0.0.1:5173
          PLAYWRIGHT_BASE_URL_APP: http://127.0.0.1:5174
          PLAYWRIGHT_BASE_URL_ANONYMOUS: http://127.0.0.1:5175
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
        run: pnpm exec playwright test

      - name: Stop Java backend
        if: always()
        run: |
          if [ -f java-dev.pid ]; then
            kill "$(cat java-dev.pid)" || true
          fi

      - name: Upload Playwright + dev server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            java-dev.log
            runtime-required.log
            runtime-optional.log
            app-anonymous.log
            admin-dev.log
            app-dev.log
