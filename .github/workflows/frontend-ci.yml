name: Frontend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Run lint
        run: pnpm turbo run lint
      - name: Build and type check
        run: pnpm turbo run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Run tests
        run: pnpm turbo run test

  # Phase 3 Day 27 — Agent C.
  #
  # Real e2e: postgres-business + redis service containers + real Java
  # backend via `mvn spring-boot:run` + admin dev server. Runs the three
  # admin specs (login / dashboard / plugin-list) plus the existing
  # mock-friendly smoke.
  #
  # Why not `docker compose up`: building agentcook-java's multi-stage
  # image in CI adds ~3-5 min; service containers + mvn-from-source skips
  # the Docker layer entirely (Maven cache is hot on warm CI).
  e2e:
    runs-on: ubuntu-latest
    needs: [lint-and-type-check]
    timeout-minutes: 25
    services:
      postgres-business:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentcook
          POSTGRES_PASSWORD: agentcook_dev
          POSTGRES_DB: agentcook_business
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U agentcook"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # admin dev server reads these to point its API clients at the
      # mvn-launched Java backend on host networking (service containers
      # are reachable via localhost when ports are mapped above).
      VITE_JAVA_API_BASE_URL: http://127.0.0.1:8080
      VITE_PYTHON_API_BASE_URL: http://127.0.0.1:8000   # Python not started; admin gracefully no-ops
      # Override Spring's hardcoded `postgres:5432` in application-docker.yml
      # so mvn spring-boot:run finds the service-container PG on :5433.
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5433/agentcook_business
      SPRING_DATASOURCE_USERNAME: agentcook
      SPRING_DATASOURCE_PASSWORD: agentcook_dev
      SPRING_DATA_REDIS_HOST: 127.0.0.1
      SPRING_DATA_REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install frontend deps
        run: pnpm install
      - name: Install Playwright browsers (chromium)
        run: pnpm exec playwright install --with-deps chromium

      # Java backend — runs from source. spring-boot:run streams stdout to
      # nohup.out so a failed boot is recoverable from the upload step.
      - name: Build Java backend (skip tests)
        working-directory: agentcook-java
        run: ./mvnw -B -ntp -DskipTests package
      - name: Start Java backend (spring-boot:run)
        working-directory: agentcook-java
        run: |
          nohup ./mvnw -B -ntp -pl agentcook-api spring-boot:run > spring-boot.log 2>&1 &
          echo $! > spring-boot.pid
      - name: Wait for Java actuator/health UP
        run: |
          for i in {1..60}; do
            if curl -fs http://127.0.0.1:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo " ← Java backend UP"; exit 0
            fi
            sleep 2
          done
          echo "Java backend failed to come up in 120s" >&2
          tail -200 agentcook-java/spring-boot.log >&2 || true
          exit 1

      - name: Start admin dev server (:5173)
        run: pnpm --filter @agentcook-cc/admin dev --port 5173 --host 127.0.0.1 > admin-dev.log 2>&1 &
      - name: Start app dev server (:5174)
        run: pnpm --filter @agentcook-cc/app dev --port 5174 --host 127.0.0.1 > app-dev.log 2>&1 &
      - name: Wait for both dev servers
        run: |
          wait_one() {
            local url=$1 label=$2
            for i in {1..30}; do
              if curl -fs "$url" >/dev/null; then
                echo " ← $label up"; return 0
              fi
              sleep 2
            done
            echo "$label failed to come up in 60s" >&2
            return 1
          }
          wait_one http://127.0.0.1:5173/ "admin dev server" || (tail -100 admin-dev.log >&2; exit 1)
          wait_one http://127.0.0.1:5174/ "app dev server" || (tail -100 app-dev.log >&2; exit 1)

      # All three Playwright projects run in one invocation. Each project
      # pins its own baseURL via env so admin specs hit :5173 and app
      # specs hit :5174, while the legacy smoke project keeps the
      # PLAYWRIGHT_BASE_URL fallback.
      - name: Run Playwright (admin + app + smoke)
        env:
          PLAYWRIGHT_BASE_URL_ADMIN: http://127.0.0.1:5173
          PLAYWRIGHT_BASE_URL_APP: http://127.0.0.1:5174
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
        run: pnpm exec playwright test --project=admin --project=app --project=smoke

      - name: Stop Java backend
        if: always()
        run: |
          if [ -f agentcook-java/spring-boot.pid ]; then
            kill "$(cat agentcook-java/spring-boot.pid)" || true
          fi

      - name: Upload Playwright + dev server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            agentcook-java/spring-boot.log
            admin-dev.log
            app-dev.log
