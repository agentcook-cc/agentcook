name: Java CI

# Phase 2 ADR-013 — Spring Boot business logic service (Agent D, Day 16+).
# Path-gated: only fires when agentcook-java/** or this file changes —
# Phase 1 work doesn't trigger this and waste CI minutes.
#
# Two jobs:
#   1. build-and-test        — fast feedback, excludes Pact verify
#   2. pact-verify           — depends on (1), spins up pact-broker as a
#                              GitHub Actions service container so it
#                              mirrors the local docker-compose.dev.yml
#                              broker setup exactly.

on:
  push:
    branches: [main, develop]
    paths:
      - "agentcook-java/**"
      - ".github/workflows/java-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "agentcook-java/**"
      - ".github/workflows/java-ci.yml"

concurrency:
  group: java-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: agentcook-java

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # Built-in Maven cache layered on hashFiles — covers ~/.m2/repository
          # and resolves toolchains.xml / settings.xml automatically.
          cache: maven

      # Custom cache adds the Maven Wrapper distribution (~/.m2/wrapper).
      # Without it CI re-downloads ~50MB of mvnw bootstrap on every run.
      # Key includes settings.xml hash so swapping mirror config invalidates.
      - name: Cache Maven Wrapper + settings
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/wrapper
          key: ${{ runner.os }}-mvnw-${{ hashFiles('agentcook-java/.mvn/wrapper/maven-wrapper.properties') }}-${{ hashFiles('agentcook-java/.mvn/settings.xml', 'agentcook-java/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-mvnw-${{ hashFiles('agentcook-java/.mvn/wrapper/maven-wrapper.properties') }}-
            ${{ runner.os }}-mvnw-

      - name: Validate + compile
        run: ./mvnw -B -ntp validate compile

      - name: Lint (Spotless / Checkstyle if configured)
        run: ./mvnw -B -ntp verify -DskipTests
        # If D doesn't wire Spotless/Checkstyle into pom.xml the verify phase
        # is a no-op for lint, harmless. Tests still excluded via -DskipTests.

      - name: Run tests (excludes Pact verify — see pact-verify job)
        run: ./mvnw -B -ntp test -DexcludedGroups=pact-verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.run_id }}
          path: agentcook-java/**/target/surefire-reports/

  pact-verify:
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      pact-broker-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pact_broker
          POSTGRES_PASSWORD: pact_broker
          POSTGRES_DB: pact_broker
        options: >-
          --health-cmd "pg_isready -U pact_broker"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      pact-broker:
        image: pactfoundation/pact-broker:latest
        env:
          PACT_BROKER_DATABASE_URL: postgres://pact_broker:pact_broker@pact-broker-db/pact_broker
          PACT_BROKER_BASIC_AUTH_USERNAME: pact
          PACT_BROKER_BASIC_AUTH_PASSWORD: pact
          PACT_BROKER_ALLOW_PUBLIC_READ: "true"
        ports:
          - 9292:9292
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:9292/diagnostic/status/heartbeat || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s
    env:
      PACT_BROKER_URL: http://localhost:9292
      PACT_BROKER_USER: pact
      PACT_BROKER_PASSWORD: pact
      PACT_PROVIDER_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Wait for Pact broker
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost:9292/diagnostic/status/heartbeat; then
              echo " ← broker up"; exit 0
            fi
            sleep 2
          done
          echo "Pact broker did not become healthy in 60s" >&2
          exit 1

      - name: Run Pact provider verify (group=pact-verify)
        run: ./mvnw -B -ntp test -Dgroups=pact-verify

      - name: Upload pact verify reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pact-verify-reports-${{ github.run_id }}
          path: agentcook-java/**/target/surefire-reports/
