name: Mirror to Gitee

# Push every commit on `main` (and tags) to the Gitee mirror so Chinese
# contributors have a domestic clone. The Gitee side is read-only — all
# development still happens on GitHub.

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    # Hourly safety net in case a push event was missed (e.g. workflow disabled
    # during incidents). Off-the-:00 minute to avoid the GitHub Actions thundering
    # herd; every-hour minutes also smooth Gitee SSH ingress load.
    - cron: "37 * * * *"
  workflow_dispatch:

concurrency:
  # One mirror run at a time — concurrent pushes to the same Gitee repo
  # cause non-fast-forward rejections.
  group: mirror-gitee
  cancel-in-progress: false

jobs:
  mirror:
    name: Push to Gitee
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          # Mirror push needs the full history; default fetch-depth is 1.
          fetch-depth: 0

      - name: Add Gitee remote (HTTPS + token in URL)
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          # Gitee deploy keys are read-only; personal access token is required for push.
          # Token is embedded in remote URL; GitHub Actions auto-masks secret values in logs.
          REMOTE_URL="https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/agentcook-cc/agentcook.git"
          git remote add gitee "$REMOTE_URL" 2>/dev/null || git remote set-url gitee "$REMOTE_URL"

      - name: Mirror push (branches + tags)
        run: |
          # `push --mirror` would clobber Gitee-only refs; we only want to mirror
          # what's on GitHub. Push branches + tags explicitly.
          git push --force gitee refs/remotes/origin/main:refs/heads/main
          git push --force gitee --tags

      - name: Summary
        if: always()
        run: |
          echo "### Gitee mirror sync" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: ${{ github.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
