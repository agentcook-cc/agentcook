name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-python:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: pip install uv
      - name: Build package
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build packages
        run: pnpm turbo run build
      - name: Publish to NPM
        run: pnpm publish --filter @agentcook-cc/* --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
