appId: com.agentcook.app
productName: AgentCook
copyright: Copyright © 2026 AgentCook

directories:
  buildResources: build
  output: release

files:
  - dist/**/*
  - electron/**/*.js
  - "!node_modules/**/*"

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  darkModeSupport: true

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Development
