[project]
name = "agentcook-core"
version = "0.1.0"
description = "Agent abstractions + Plugin Bundle interface + 9-module protocols"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcook_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
    "unit: fast tests with no external deps",
    "integration: tests requiring testcontainers (Docker daemon)",
    "slow: tests that take >5s",
]
