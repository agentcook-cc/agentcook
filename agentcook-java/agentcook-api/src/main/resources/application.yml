spring:
  application:
    name: agentcook-java

  # K8s preStop hook fires SIGTERM; Spring Boot then waits up to this long
  # before forcing shutdown. K8s default terminationGracePeriodSeconds=30.
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    # Default values point at the host (IDEA Run / mvn spring-boot:run friendly):
    # postgres-business is exposed on host port 5433 (5432 is pgvector).
    # The docker profile (application-docker.yml) overrides host=postgres + port=5432
    # for in-network container access.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:agentcook_business}
    username: ${POSTGRES_USER:agentcook}
    password: ${POSTGRES_PASSWORD:agentcook_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Day 51 (Phase 5 perf tuning, C ping D §2 from Day 50 perf report):
      # 10 → 30 unblocks ~600 RPS sustained at 50ms/conn hold time vs the
      # ~200 RPS ceiling the old pool imposed once 200u locust traffic
      # arrived. The prod profile (application-prod.yml) keeps its own
      # values; this default applies to dev / docker / k8s profiles.
      maximum-pool-size: 30
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  cache:
    type: simple

server:
  port: 8080
  # Drain in-flight requests on SIGTERM (K8s pod termination grace).
  shutdown: graceful
  tomcat:
    # Day 51: Spring Boot's default tomcat.threads.max=200 / accept-count=100
    # capped sustained concurrency at 200 in-flight requests, so 500u locust
    # traffic queued at the connector and saw 5-15s tail latency. Raising
    # both is safe at our heap size (1Gi limits.memory in Helm Day 50) —
    # Tomcat threads are NIO workers, not OS threads-per-connection.
    threads:
      max: 400
    accept-count: 200

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

# Phase 3 dev secret for HS256 JWTs. Override via env in any environment
# beyond local dev: export AGENTCOOK_AUTH_JWT_SECRET=<32+ byte secret>.
# Phase 4 Day 33-34 replaces this with JWKS from a real identity issuer
# and the secret config disappears.
grpc:
  server:
    port: ${GRPC_SERVER_PORT:9090}

agentcook:
  python-upstream-url: ${PYTHON_UPSTREAM_URL:http://localhost:8000}
  auth:
    jwt-secret: ${AGENTCOOK_AUTH_JWT_SECRET:phase3-dev-secret-not-for-prod-32bytes!!}
    jwt-ttl-seconds: ${AGENTCOOK_AUTH_JWT_TTL_SECONDS:3600}
  # Buffer Day 62 / Phase 5 backlog #11 — Cloudflare Turnstile.
  # Empty secret means "skip verification" (dev / test profile).
  # Set AGENTCOOK_TURNSTILE_SECRET in any environment that needs the
  # gate to actually run — see draft-cloudflare-turnstile-rate-limit-design.md
  # for the cascade.
  turnstile:
    secret: ${AGENTCOOK_TURNSTILE_SECRET:}
    siteverify-url: ${AGENTCOOK_TURNSTILE_SITEVERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
