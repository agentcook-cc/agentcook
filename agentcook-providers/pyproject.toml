[project]
name = "agentcook-providers"
version = "0.1.0"
description = "LLM Provider adapters (OpenAI / Anthropic / Qwen / Zhipu)"
requires-python = ">=3.11"
dependencies = [
    "agentcook-core",
]

[project.optional-dependencies]
openai = ["openai>=1.50"]
anthropic = ["anthropic>=0.40"]
qwen = ["openai>=1.50"]
zhipu = ["zai-sdk>=0.0.4"]
all = ["openai>=1.50", "anthropic>=0.40", "zai-sdk>=0.0.4"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "openai>=1.50",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcook_providers"]

[tool.uv.sources]
agentcook-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
    "unit: fast tests with no external deps",
    "integration: tests requiring testcontainers (Docker daemon)",
    "slow: tests that take >5s",
]
