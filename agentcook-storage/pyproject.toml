[project]
name = "agentcook-storage"
version = "0.1.0"
description = "Storage abstractions (PostgreSQL+pgvector / Redis / S3)"
requires-python = ">=3.11"
dependencies = [
    "agentcook-core",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29", "pgvector>=0.3"]
redis = ["redis>=5.0"]
s3 = ["aioboto3>=12.0"]
all = ["asyncpg>=0.29", "pgvector>=0.3", "redis>=5.0", "aioboto3>=12.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "redis>=5.0",
    "aioboto3>=12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcook_storage"]

[tool.uv.sources]
agentcook-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
    "unit: fast tests with no external deps",
    "integration: tests requiring testcontainers (Docker daemon)",
    "slow: tests that take >5s",
]
