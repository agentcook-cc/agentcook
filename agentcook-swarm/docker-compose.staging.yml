version: "3.9"

# agentcook-swarm: STAGING-FULL profile
#
# Superset of docker-compose.swarm.yml with the full observability +
# storage + service-discovery stack, used for:
#   - C's E2E + perf testing (`make staging-up && ./scripts/staging-smoke.sh`)
#   - Internal demo / dogfooding
#
# 15 services in 3 layers:
#   1. App   (6) — gateway + agent-core + admin-bff + connector + admin-static + app-static
#   2. Infra (3) — postgres + redis + etcd
#   3. Obs   (6) — otel-collector + jaeger + prometheus + grafana + loki + promtail
#
# All telemetry pipes:
#   spans   → OTLP gRPC → otel-collector → Jaeger
#   metrics → OTLP gRPC → otel-collector → Prometheus (pull)
#   logs    → container stdout → Promtail → Loki
#
# Grafana auto-loads 3 dashboards (overview / llm-metrics / service-health)
# via the provisioning files mounted below.

services:
  # ==========================================================================
  # App services
  # ==========================================================================
  gateway:
    image: traefik:v3.0
    ports:
      - "80:80"
      - "8081:8080"
      - "9090:9090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./gateway/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./gateway/dynamic:/etc/traefik/dynamic:ro
    networks: [staging-net]

  agent-core:
    build:
      context: ../agentcook
      dockerfile: Dockerfile
    environment:
      - DEPLOY_ENV=staging
      - OTEL_SERVICE_NAME=agent-core
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LOG_LEVEL=INFO
      - ETCD_HOST=etcd
      - AGENTCOOK_VERSION=1.0.0-staging
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agent.rule=PathPrefix(`/api/v1/chat`) || PathPrefix(`/api/v1/skills`) || PathPrefix(`/api/v1/logs`) || PathPrefix(`/api/v1/agents`)"
      - "traefik.http.services.agent.loadbalancer.server.port=8000"
    depends_on: [postgres, redis, etcd, otel-collector]
    networks: [staging-net]

  admin-bff:
    build:
      context: ../agentcook-java
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=staging
      - OTEL_SERVICE_NAME=admin-bff
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - DEPLOY_ENV=staging
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=PathPrefix(`/api/v1/users`) || PathPrefix(`/api/v1/plugins`) || PathPrefix(`/api/v1/sessions`) || PathPrefix(`/api/v1/connectors`) || PathPrefix(`/api/v1/permissions`) || PathPrefix(`/api/v1/auth`)"
      - "traefik.http.services.admin.loadbalancer.server.port=8080"
    depends_on: [postgres, redis, otel-collector]
    networks: [staging-net]

  connector:
    build:
      context: ./services/connector
      dockerfile: Dockerfile
    environment:
      - DEPLOY_ENV=staging
      - OTEL_SERVICE_NAME=connector
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - AGENT_CORE_HOST=agent-core
      - AGENT_CORE_GRPC_PORT=50051
      - ETCD_HOST=etcd
      - LOG_LEVEL=INFO
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.connector.rule=PathPrefix(`/api/v1/connectors/exec`)"
      - "traefik.http.services.connector.loadbalancer.server.port=8082"
    depends_on: [agent-core, etcd, otel-collector]
    networks: [staging-net]

  admin-static:
    build:
      context: ../../
      dockerfile: agentcook-cc/agentcook-swarm/services/admin-static/Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin-static.rule=PathPrefix(`/admin`)"
      - "traefik.http.routers.admin-static.middlewares=strip-admin-prefix"
      - "traefik.http.middlewares.strip-admin-prefix.stripprefix.prefixes=/admin"
      - "traefik.http.services.admin-static.loadbalancer.server.port=80"
    networks: [staging-net]

  app-static:
    build:
      context: ../../
      dockerfile: agentcook-cc/agentcook-swarm/services/app-static/Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app-static.rule=PathPrefix(`/app`)"
      - "traefik.http.routers.app-static.middlewares=strip-app-prefix"
      - "traefik.http.middlewares.strip-app-prefix.stripprefix.prefixes=/app"
      - "traefik.http.services.app-static.loadbalancer.server.port=80"
    networks: [staging-net]

  # ==========================================================================
  # Infra
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentcook_business
      POSTGRES_USER: agentcook
      POSTGRES_PASSWORD: agentcook_staging
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [staging-net]

  redis:
    image: redis:7-alpine
    networks: [staging-net]

  etcd:
    image: bitnami/etcd:3.5
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
    networks: [staging-net]

  # ==========================================================================
  # Observability — traces (OTel → Jaeger)
  # ==========================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"   # Prometheus exporter from collector
    depends_on: [jaeger]
    networks: [staging-net]

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # UI
    networks: [staging-net]

  # ==========================================================================
  # Observability — metrics (Prometheus)
  # ==========================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports:
      - "9091:9090"   # 9090 collides with traefik gRPC, expose on 9091
    depends_on: [otel-collector]
    networks: [staging-net]

  # ==========================================================================
  # Observability — logs (Loki + Promtail)
  # ==========================================================================
  loki:
    image: grafana/loki:2.9.6
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./observability/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks: [staging-net]

  promtail:
    image: grafana/promtail:2.9.6
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [staging-net]

  # ==========================================================================
  # Observability — dashboards (Grafana)
  # ==========================================================================
  grafana:
    image: grafana/grafana:10.4.2
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus, loki, jaeger]
    networks: [staging-net]

volumes:
  pgdata:
  prom-data:
  loki-data:
  grafana-data:

networks:
  staging-net:
    driver: bridge
