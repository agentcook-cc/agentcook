# Traefik v3 dynamic configuration — middlewares
http:
  middlewares:
    cors-allow:
      headers:
        accessControlAllowOriginList:
          - "http://localhost:5173"
          - "http://localhost:5174"
          - "http://localhost:3000"
          - "https://agentcook.cc"
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Content-Type"
          - "Authorization"
          - "X-Request-ID"
        accessControlMaxAge: 3600
        addVaryHeader: true

    rate-limit:
      rateLimit:
        average: 100
        burst: 200
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 1

    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        customResponseHeaders:
          X-Powered-By: ""
          Server: ""
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true

    api-chain:
      chain:
        middlewares:
          - cors-allow
          - rate-limit
          - security-headers
