# Prometheus scrape config for staging.
#
# Two scrape targets matter for agentcook:
#   1. otel-collector :8889 — exposes everything the OTel SDK exporters
#      pushed (HTTP request counts, gRPC counts, custom meters).
#   2. application services :8000/:8082 directly — they expose
#      `/metrics` (Python prometheus_client) if the service opts in.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
    metrics_path: /metrics

  - job_name: agent-core
    static_configs:
      - targets: ["agent-core:8000"]
    metrics_path: /metrics

  - job_name: connector
    static_configs:
      - targets: ["connector:8082"]
    metrics_path: /metrics

  - job_name: admin-bff
    static_configs:
      - targets: ["admin-bff:8080"]
    metrics_path: /actuator/prometheus
