# Promtail — tails Docker container stdout and ships to Loki.
#
# Each container's stdout JSON is parsed; Promtail strips the docker
# wrapper (timestamp + stream key) and forwards the inner payload
# (the structlog JSON our services emit) plus a `service` label
# derived from the container name.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Container name (without leading "/") becomes the `service` label.
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'service'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
    pipeline_stages:
      # The Docker engine wraps each line as
      #   {"log": "<actual app line>", "stream": "stdout", "time": "..."}
      - json:
          expressions:
            output: log
            stream: stream
            timestamp: time
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - output:
          source: output
