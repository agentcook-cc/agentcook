[project]
name = "agentcook-swarm"
version = "0.1.0"
description = "Microservice version (gateway + agent/skills/connector/admin)"
requires-python = ">=3.11"
dependencies = [
    "agentcook-core",
    "agentcook-providers",
    "agentcook-storage",
    "grpcio>=1.60.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcook_swarm"]

[tool.uv.sources]
agentcook-core = { workspace = true }
agentcook-providers = { workspace = true }
agentcook-storage = { workspace = true }
