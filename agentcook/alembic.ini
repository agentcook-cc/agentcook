[alembic]
# Migrations for the agentcook runtime DB (memory_events / agents / soul_versions).
# Per ADR-013 this DB is owned by the Python runtime; user / permission /
# audit tables live in agentcook-java's separate `agentcook_business` DB.

script_location = alembic
prepend_sys_path = .
sqlalchemy.url = postgresql+asyncpg://agentcook:agentcook@localhost:5432/agentcook

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
