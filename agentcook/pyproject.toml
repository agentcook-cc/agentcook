[project]
name = "agentcook"
version = "0.1.0"
description = "FastAPI Agent runtime — Memory API, JWT verify (issued by agentcook-java per ADR-013)"
requires-python = ">=3.11"
dependencies = [
    "agentcook-core",
    "agentcook-providers",
    "agentcook-storage",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pyjwt[crypto]>=2.8",
    "alembic>=1.13",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "prometheus-client>=0.25.0",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "schemathesis>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcook_app"]

[tool.uv.sources]
agentcook-core = { workspace = true }
agentcook-providers = { workspace = true }
agentcook-storage = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
    "unit: fast tests with no external deps",
    "integration: tests requiring testcontainers (Docker daemon)",
    "slow: tests that take >5s",
]
