apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentcook.fullname" . }}-agent-core
  labels:
    {{- include "agentcook.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-core
spec:
  replicas: {{ .Values.agentCore.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentcook.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent-core
  template:
    metadata:
      labels:
        {{- include "agentcook.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent-core
    spec:
      containers:
        - name: agent-core
          image: "{{ .Values.agentCore.image.repository }}:{{ .Values.agentCore.image.tag }}"
          imagePullPolicy: {{ .Values.agentCore.image.pullPolicy }}
          {{- with .Values.agentCore.extraArgs }}
          # Day 50 perf tuning: prod overrides uvicorn workers via
          # `agentCore.extraArgs: ["--workers", "4"]`. Image's default
          # CMD already invokes uvicorn; these flags are appended.
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.agentCore.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "agentcook.fullname" . }}-config
            - secretRef:
                name: {{ include "agentcook.fullname" . }}-secret
          {{- if .Values.observability.enabled }}
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otelEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.observability.otelProtocol | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.observability.serviceName.agentCore | quote }}
            - name: OTEL_TRACES_SAMPLER
              value: {{ .Values.observability.sampler | quote }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .Values.observability.samplerArg | quote }}
          {{- end }}
