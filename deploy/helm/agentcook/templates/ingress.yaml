apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agentcook.fullname" . }}-ingress
  labels:
    {{- include "agentcook.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api/v1/chat/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "agentcook.fullname" . }}-agent-core
                port:
                  number: 8000
          - path: /api/v1/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "agentcook.fullname" . }}-admin-bff
                port:
                  number: 8080
          - path: /admin/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "agentcook.fullname" . }}-admin-static
                port:
                  number: 80
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "agentcook.fullname" . }}-app-static
                port:
                  number: 80
