# Global configuration
global:
  domain: agentcook.cc
  tls: false
  etcdUrl: "etcd://etcd-server:2379"

# Secrets — placeholders only. Real values come from CD pipeline
# `--set secret.dbPassword=...` or a SealedSecret / ExternalSecret.
# Block must exist so `.Values.secret.dbPassword` is addressable
# (nil parent objects break `| default` in templates/secret.yaml).
secret:
  dbPassword: ""
  jwtSecret: ""

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: agentcook.cc
      paths:
        - path: /
          pathType: Prefix

# HPA configuration
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPU: 80

# PodDisruptionBudget — only enabled in staging/prod overrides.
pdb:
  enabled: false
  minAvailable: 1

# NetworkPolicy — default-deny + per-service allow. Off in dev (k3d/kind
# usually skip CNI policy enforcement), on in prod (cluster CNI must
# support NetworkPolicy: Calico / Cilium / kube-router).
networkPolicy:
  enabled: false
  # Namespace label selector for Ingress controller (override if you run
  # ingress-nginx in a different ns).
  ingressNamespace: ingress-nginx

# PrometheusRule — requires kube-prometheus-stack CRD installed.
# 7 alerts cover HTTP/p99/restarts/OOM/CPU/LLM cost/chat fail. Token cost
# threshold is in USD per 24h window (default 50; raise per real budget).
prometheusRule:
  enabled: false
  tokenCostThresholdUsd: 50
  additionalLabels: {}

# Rate limit — K8s 层兜底(Cloudflare Worker 是首选 / 详 docs/adr/draft-
# cloudflare-turnstile-rate-limit-design.md)。开 prod / staging,关 dev。
# 阈值与 workers/rate-limit/wrangler.toml 一致。
rateLimit:
  enabled: false
  perIpPerMin: "200"
  perIpPerSecond: "10"
  maxConcurrentConnections: "20"
  # 白名单 CIDR(可选,逗号分隔)— 内部办公网 / CI runner IP 不限速
  whitelistSourceRange: ""

# Shared app config — injected as ConfigMap, mounted as envFrom on every
# Deployment. Real URLs come from values-staging.yaml / values-prod.yaml.
config:
  databaseUrl: "postgresql://postgres:postgres@postgres:5432/agentcook"
  redisUrl: "redis://redis:6379/0"
  etcdUrl: "etcd://etcd-server:2379"
  logLevel: "info"

# Observability — aligned with `agentcook-swarm/otel-collector-config.yaml`
# (A Day 41). Each service template injects OTEL_EXPORTER_OTLP_ENDPOINT +
# OTEL_SERVICE_NAME into its container's env from this block. The collector
# is expected to run in the same namespace so the in-cluster DNS name
# `otel-collector:4317` resolves; values-staging / values-prod override
# the endpoint when the collector lives in a sidecar or central namespace.
observability:
  enabled: true
  otelEndpoint: "http://otel-collector:4317"
  otelProtocol: "grpc"
  # Per-service `service.name` resource attribute — Jaeger / Prometheus
  # group by this label, so it must match what A registers on each
  # Python / Java SDK boot.
  serviceName:
    agentCore: "agent-core"
    adminBff: "admin-bff"
    connector: "connector"
  # 100% sampling in dev/staging; values-prod.yaml drops to 0.1 ratio.
  sampler: "parentbased_traceidratio"
  samplerArg: "1.0"

# Agent Core service (Python FastAPI)
agentCore:
  image:
    repository: agentcook/agent-core
    tag: latest
  replicaCount: 1
  port: 8000
  # Day 50 C 调优 #1 实测保留 — uvicorn 1→4 workers:login p95 -47% /
  # login fail rate -95% / chat 0 退化(详 audit/phase5-day50-performance-report.md §4
  # 瓶颈 #1)。Day 52 A 接 C ping 待办 落 prod。
  extraArgs:
    - "--workers"
    - "4"
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  env: {}

# Admin BFF service (Java Spring Boot)
# Day 50: memory limit raised 512Mi → 1Gi. Live JVM uses
# MaxRAMPercentage=75, so the previous 512Mi cap left ~384Mi for the
# heap and basically nothing for native heap (metaspace, code cache,
# direct buffers, thread stacks). 1Gi gives ~768Mi heap with ~256Mi
# native headroom, which is what eclipse-temurin-17 expects on a JVM
# carrying springdoc + JPA + grpc-netty + jetcd.
adminBff:
  image:
    repository: agentcook/admin-bff
    tag: latest
  replicaCount: 1
  port: 8080
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  env: {}

# Connector service (Python FastAPI)
connector:
  image:
    repository: agentcook/connector
    tag: latest
  replicaCount: 1
  port: 8082
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  env: {}

# Admin Static (Nginx)
adminStatic:
  image:
    repository: agentcook/admin-static
    tag: latest
  replicaCount: 1
  port: 80
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  env: {}

# App Static (Nginx)
appStatic:
  image:
    repository: agentcook/app-static
    tag: latest
  replicaCount: 1
  port: 80
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  env: {}
