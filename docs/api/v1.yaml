components:
  schemas:
    DelegationEdge:
      additionalProperties: false
      description: A single delegation event from ``from_id`` to ``to_id`` (a reactflow edge).
      properties:
        completed_at:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO-8601 UTC; null while in-flight.
          title: Completed At
        from_id:
          description: Delegator agent id.
          title: From Id
          type: string
        id:
          description: Stable edge identifier.
          title: Id
          type: string
        started_at:
          description: ISO-8601 UTC timestamp.
          title: Started At
          type: string
        status:
          description: Lifecycle state of the delegation.
          enum:
          - pending
          - running
          - succeeded
          - failed
          - cancelled
          title: Status
          type: string
        task:
          description: Short description of the delegated task.
          title: Task
          type: string
        to_id:
          description: Delegate agent id.
          title: To Id
          type: string
      required:
      - id
      - from_id
      - to_id
      - task
      - status
      - started_at
      title: DelegationEdge
      type: object
    DelegationGraphResponse:
      additionalProperties: false
      description: '``GET /api/v1/agents/{agent_id}/delegations`` envelope.'
      properties:
        agent_id:
          description: Root agent the graph is centred on.
          title: Agent Id
          type: string
        edges:
          description: Delegation events, oldest first.
          items:
            $ref: '#/components/schemas/DelegationEdge'
          title: Edges
          type: array
        nodes:
          description: All agents that participated.
          items:
            $ref: '#/components/schemas/DelegationNode'
          title: Nodes
          type: array
      required:
      - agent_id
      - nodes
      - edges
      title: DelegationGraphResponse
      type: object
    DelegationNode:
      additionalProperties: false
      description: One agent in the delegation graph (a reactflow node).
      properties:
        id:
          description: Stable agent identifier within this graph.
          title: Id
          type: string
        name:
          description: Display label.
          title: Name
          type: string
        role:
          description: Agent role (planner / coder / reviewer / ...).
          title: Role
          type: string
      required:
      - id
      - name
      - role
      title: DelegationNode
      type: object
    ErrorEnvelope:
      additionalProperties: false
      description: Flat error shape — matches frontend-conventions §7.6 (B canonical).
      properties:
        code:
          description: Machine-readable error code (UPPER_SNAKE).
          title: Code
          type: string
        detail:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: Optional structured context.
          title: Detail
        message:
          description: Human-readable description.
          title: Message
          type: string
      required:
      - code
      - message
      title: ErrorEnvelope
      type: object
    FlushRequest:
      additionalProperties: false
      properties:
        confirm:
          const: I understand this deletes all events for this agent.
          description: Exact string required to prevent accidental flush.
          title: Confirm
          type: string
        preserve_identity_and_soul:
          default: true
          title: Preserve Identity And Soul
          type: boolean
      required:
      - confirm
      title: FlushRequest
      type: object
    FlushResponse:
      additionalProperties: false
      properties:
        deleted_event_count:
          title: Deleted Event Count
          type: integer
        identity_preserved:
          title: Identity Preserved
          type: boolean
        soul_preserved:
          title: Soul Preserved
          type: boolean
      required:
      - deleted_event_count
      - identity_preserved
      - soul_preserved
      title: FlushResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    IdentityResponse:
      additionalProperties: false
      properties:
        created_at:
          description: ISO-8601 UTC timestamp
          title: Created At
          type: string
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        name:
          title: Name
          type: string
        role:
          title: Role
          type: string
        scopes:
          items:
            type: string
          title: Scopes
          type: array
      required:
      - name
      - role
      - created_at
      title: IdentityResponse
      type: object
    MemoryEventCreate:
      additionalProperties: false
      description: 'Body for ``POST /agents/{id}/memory/events``.


        Server assigns ``id`` and (if omitted) ``timestamp``.'
      properties:
        content:
          maxLength: 16384
          minLength: 1
          title: Content
          type: string
        kind:
          enum:
          - observation
          - decision
          - tool_use
          - user_input
          - reflection
          title: Kind
          type: string
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
        timestamp:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO-8601 UTC. If omitted, server sets it at write time.
          title: Timestamp
      required:
      - kind
      - content
      title: MemoryEventCreate
      type: object
    MemoryEventListResponse:
      additionalProperties: false
      description: 'Cursor-pagination response.


        Note: per `frontend-conventions §7.6` constraint #5 list endpoints

        should expose ``{items, total, page, size}``. Memory event listing

        intentionally uses **cursor pagination** instead (event streams are

        append-only — page/size becomes unstable as new events arrive).

        Documented exception; flagged in §7 increment to B.'
      properties:
        items:
          items:
            $ref: '#/components/schemas/MemoryEventResponse'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      title: MemoryEventListResponse
      type: object
    MemoryEventResponse:
      additionalProperties: false
      properties:
        content:
          title: Content
          type: string
        id:
          description: String id to avoid enumeration attacks.
          title: Id
          type: string
        kind:
          enum:
          - observation
          - decision
          - tool_use
          - user_input
          - reflection
          title: Kind
          type: string
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
        timestamp:
          title: Timestamp
          type: string
      required:
      - id
      - timestamp
      - kind
      - content
      title: MemoryEventResponse
      type: object
    MemoryHitResponse:
      additionalProperties: false
      properties:
        content:
          title: Content
          type: string
        event:
          anyOf:
          - $ref: '#/components/schemas/MemoryEventResponse'
          - type: 'null'
        score:
          maximum: 1.0
          minimum: 0.0
          title: Score
          type: number
      required:
      - content
      - score
      title: MemoryHitResponse
      type: object
    SearchRequest:
      additionalProperties: false
      properties:
        query:
          maxLength: 1024
          minLength: 1
          title: Query
          type: string
        top_k:
          default: 5
          maximum: 50.0
          minimum: 1.0
          title: Top K
          type: integer
      required:
      - query
      title: SearchRequest
      type: object
    SearchResponse:
      additionalProperties: false
      properties:
        hits:
          items:
            $ref: '#/components/schemas/MemoryHitResponse'
          title: Hits
          type: array
        query:
          title: Query
          type: string
      required:
      - query
      title: SearchResponse
      type: object
    SkillDetailResponse:
      additionalProperties: false
      description: '``GET /api/v1/skills/{id}`` — adds the skill body (markdown + frontmatter).'
      properties:
        body:
          description: Raw skill body (markdown). Empty for placeholder skills.
          title: Body
          type: string
        category:
          description: Loose grouping (memory / nlp / chat / ...).
          title: Category
          type: string
        description:
          description: One-line summary.
          title: Description
          type: string
        id:
          description: Stable skill identifier (kebab-case).
          title: Id
          type: string
        name:
          description: Display name.
          title: Name
          type: string
        updated_at:
          description: ISO-8601 UTC timestamp of last edit.
          title: Updated At
          type: string
        version:
          description: Semver string from the skill manifest.
          title: Version
          type: string
      required:
      - id
      - name
      - description
      - version
      - category
      - updated_at
      - body
      title: SkillDetailResponse
      type: object
    SkillListResponse:
      additionalProperties: false
      description: Envelope for the skill list endpoint.
      properties:
        items:
          description: Skills, ordered as the registry yields them.
          items:
            $ref: '#/components/schemas/SkillSummary'
          title: Items
          type: array
        total:
          description: Total count — equals ``len(items)`` until pagination lands.
          title: Total
          type: integer
      required:
      - items
      - total
      title: SkillListResponse
      type: object
    SkillSummary:
      additionalProperties: false
      description: One row in ``GET /api/v1/skills`` — what B's SkillListView shows.
      properties:
        category:
          description: Loose grouping (memory / nlp / chat / ...).
          title: Category
          type: string
        description:
          description: One-line summary.
          title: Description
          type: string
        id:
          description: Stable skill identifier (kebab-case).
          title: Id
          type: string
        name:
          description: Display name.
          title: Name
          type: string
        updated_at:
          description: ISO-8601 UTC timestamp of last edit.
          title: Updated At
          type: string
        version:
          description: Semver string from the skill manifest.
          title: Version
          type: string
      required:
      - id
      - name
      - description
      - version
      - category
      - updated_at
      title: SkillSummary
      type: object
    SkillTestRequest:
      additionalProperties: false
      description: 'Body for ``POST /api/v1/skills/{id}/test/stream``.


        The ``input`` is whatever the SkillTestDialog''s textarea contains;

        structured ``args`` may be added later (Phase 5 once real skill

        schemas are loaded). Today the SSE mock ignores ``args`` and just

        echoes ``input`` back through the streamed chunks.'
      properties:
        args:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: Optional structured args (Phase 5).
          title: Args
        input:
          description: Free-form test input the skill will receive.
          title: Input
          type: string
      required:
      - input
      title: SkillTestRequest
      type: object
    SoulConfigBody:
      additionalProperties: false
      properties:
        custom_traits:
          additionalProperties:
            type: string
          title: Custom Traits
          type: object
        language_style:
          default: concise
          title: Language Style
          type: string
        tone:
          default: neutral
          title: Tone
          type: string
        values:
          items:
            type: string
          title: Values
          type: array
      title: SoulConfigBody
      type: object
    SoulHistoryResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/SoulVersionResponse'
          title: Items
          type: array
      title: SoulHistoryResponse
      type: object
    SoulResponse:
      additionalProperties: false
      description: Returned with the persisted version (echoes input on POST).
      properties:
        custom_traits:
          additionalProperties:
            type: string
          title: Custom Traits
          type: object
        language_style:
          default: concise
          title: Language Style
          type: string
        tone:
          default: neutral
          title: Tone
          type: string
        values:
          items:
            type: string
          title: Values
          type: array
      title: SoulResponse
      type: object
    SoulVersionResponse:
      additionalProperties: false
      description: A single point in the per-agent soul history.
      properties:
        config:
          $ref: '#/components/schemas/SoulConfigBody'
        created_at:
          title: Created At
          type: string
        version:
          minimum: 1.0
          title: Version
          type: integer
      required:
      - version
      - created_at
      - config
      title: SoulVersionResponse
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  description: Agent runtime + Memory API. JWT verification only — token issuance lives in agentcook-java (ADR-013). Wire
    format conforms to frontend-conventions §7.6.
  title: agentcook runtime
  version: 1.2.0
  x-changelog: docs/api/CHANGELOG.md
  x-frozen: '2026-06-07'
  x-paired-spec: docs/api/java-v1.yaml
  x-scope: python-runtime
openapi: 3.1.0
paths:
  /api/v1/agents/{agent_id}/delegations:
    get:
      description: 'Today: returns a fixed 3-node / 2-edge demo graph for any agent_id.


        Phase 5: reads from a live ``MultiAgentOrchestrator.snapshot()`` so

        B''s reactflow component shows the actual runtime topology.'
      operationId: get_delegations_api_v1_agents__agent_id__delegations_get
      parameters:
      - description: Root agent id
        in: path
        name: agent_id
        required: true
        schema:
          description: Root agent id
          pattern: ^[a-zA-Z0-9_-]+$
          title: Agent Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegationGraphResponse'
          description: Successful Response
        '404':
          description: Agent not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Fetch the delegation graph rooted at an agent
      tags:
      - delegations
  /api/v1/agents/{agent_id}/identity:
    get:
      operationId: get_identity_api_v1_agents__agent_id__identity_get
      parameters:
      - description: Agent identifier
        in: path
        name: agent_id
        required: true
        schema:
          description: Agent identifier
          pattern: ^[A-Za-z0-9_\-]{1,64}$
          title: Agent Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Malformed request body (e.g. invalid JSON).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing or invalid access token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authenticated user lacks required scope.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Agent not found.
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: HTTP method not allowed on this path.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Path / query / body validation failed.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Internal server error.
      summary: Read an Agent's immutable identity card (ADR-011 layer 1).
      tags:
      - memory
  /api/v1/agents/{agent_id}/memory/events:
    get:
      operationId: list_memory_events_api_v1_agents__agent_id__memory_events_get
      parameters:
      - description: Agent identifier
        in: path
        name: agent_id
        required: true
        schema:
          description: Agent identifier
          pattern: ^[A-Za-z0-9_\-]{1,64}$
          title: Agent Id
          type: string
      - description: ISO-8601 UTC lower bound.
        in: query
        name: since
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO-8601 UTC lower bound.
          title: Since
      - in: query
        name: kind
        required: false
        schema:
          anyOf:
          - enum:
            - observation
            - decision
            - tool_use
            - user_input
            - reflection
            type: string
          - type: 'null'
          title: Kind
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryEventListResponse'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Malformed request body (e.g. invalid JSON).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing or invalid access token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authenticated user lacks required scope.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Agent not found.
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: HTTP method not allowed on this path.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Path / query / body validation failed.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Internal server error.
      summary: List memory events (cursor pagination, oldest → newest within page).
      tags:
      - memory
    post:
      operationId: append_memory_event_api_v1_agents__agent_id__memory_events_post
      parameters:
      - description: Agent identifier
        in: path
        name: agent_id
        required: true
