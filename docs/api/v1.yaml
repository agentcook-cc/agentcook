components:
  schemas:
    ErrorEnvelope:
      additionalProperties: false
      description: Flat error shape — matches frontend-conventions §7.6 (B canonical).
      properties:
        code:
          description: Machine-readable error code (UPPER_SNAKE).
          title: Code
          type: string
        detail:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: Optional structured context.
          title: Detail
        message:
          description: Human-readable description.
          title: Message
          type: string
      required:
      - code
      - message
      title: ErrorEnvelope
      type: object
    FlushRequest:
      additionalProperties: false
      properties:
        confirm:
          const: I understand this deletes all events for this agent.
          description: Exact string required to prevent accidental flush.
          title: Confirm
          type: string
        preserve_identity_and_soul:
          default: true
          title: Preserve Identity And Soul
          type: boolean
      required:
      - confirm
      title: FlushRequest
      type: object
    FlushResponse:
      additionalProperties: false
      properties:
        deleted_event_count:
          title: Deleted Event Count
          type: integer
        identity_preserved:
          title: Identity Preserved
          type: boolean
        soul_preserved:
          title: Soul Preserved
          type: boolean
      required:
      - deleted_event_count
      - identity_preserved
      - soul_preserved
      title: FlushResponse
      type: object
    IdentityResponse:
      additionalProperties: false
      properties:
        created_at:
          description: ISO-8601 UTC timestamp
          title: Created At
          type: string
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        name:
          title: Name
          type: string
        role:
          title: Role
          type: string
        scopes:
          items:
            type: string
          title: Scopes
          type: array
      required:
      - name
      - role
      - created_at
      title: IdentityResponse
      type: object
    MemoryEventCreate:
      additionalProperties: false
      description: 'Body for ``POST /agents/{id}/memory/events``.


        Server assigns ``id`` and (if omitted) ``timestamp``.'
      properties:
        content:
          maxLength: 16384
          minLength: 1
          title: Content
          type: string
        kind:
          enum:
          - observation
          - decision
          - tool_use
          - user_input
          - reflection
          title: Kind
          type: string
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
        timestamp:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO-8601 UTC. If omitted, server sets it at write time.
          title: Timestamp
      required:
      - kind
      - content
      title: MemoryEventCreate
      type: object
    MemoryEventListResponse:
      additionalProperties: false
      description: 'Cursor-pagination response.


        Note: per `frontend-conventions §7.6` constraint #5 list endpoints

        should expose ``{items, total, page, size}``. Memory event listing

        intentionally uses **cursor pagination** instead (event streams are

        append-only — page/size becomes unstable as new events arrive).

        Documented exception; flagged in §7 increment to B.'
      properties:
        items:
          items:
            $ref: '#/components/schemas/MemoryEventResponse'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      title: MemoryEventListResponse
      type: object
    MemoryEventResponse:
      additionalProperties: false
      properties:
        content:
          title: Content
          type: string
        id:
          description: String id to avoid enumeration attacks.
          title: Id
          type: string
        kind:
          enum:
          - observation
          - decision
          - tool_use
          - user_input
          - reflection
          title: Kind
          type: string
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
        timestamp:
          title: Timestamp
          type: string
      required:
      - id
      - timestamp
      - kind
      - content
      title: MemoryEventResponse
      type: object
    MemoryHitResponse:
      additionalProperties: false
      properties:
        content:
          title: Content
          type: string
        event:
          anyOf:
          - $ref: '#/components/schemas/MemoryEventResponse'
          - type: 'null'
        score:
          maximum: 1.0
          minimum: 0.0
          title: Score
          type: number
      required:
      - content
      - score
      title: MemoryHitResponse
      type: object
    SearchRequest:
      additionalProperties: false
      properties:
        query:
          maxLength: 1024
          minLength: 1
          title: Query
          type: string
        top_k:
          default: 5
          maximum: 50.0
          minimum: 1.0
          title: Top K
          type: integer
      required:
      - query
      title: SearchRequest
      type: object
    SearchResponse:
      additionalProperties: false
      properties:
        hits:
          items:
            $ref: '#/components/schemas/MemoryHitResponse'
          title: Hits
          type: array
        query:
          title: Query
          type: string
      required:
      - query
      title: SearchResponse
      type: object
    SoulConfigBody:
      additionalProperties: false
      properties:
        custom_traits:
          additionalProperties:
            type: string
          title: Custom Traits
          type: object
        language_style:
          default: concise
          title: Language Style
          type: string
        tone:
          default: neutral
          title: Tone
          type: string
        values:
          items:
            type: string
          title: Values
          type: array
      title: SoulConfigBody
      type: object
    SoulHistoryResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/SoulVersionResponse'
          title: Items
          type: array
      title: SoulHistoryResponse
      type: object
    SoulResponse:
      additionalProperties: false
      description: Returned with the persisted version (echoes input on POST).
      properties:
        custom_traits:
          additionalProperties:
            type: string
          title: Custom Traits
          type: object
        language_style:
          default: concise
          title: Language Style
          type: string
        tone:
          default: neutral
          title: Tone
          type: string
        values:
          items:
            type: string
          title: Values
          type: array
      title: SoulResponse
      type: object
    SoulVersionResponse:
      additionalProperties: false
      description: A single point in the per-agent soul history.
      properties:
        config:
          $ref: '#/components/schemas/SoulConfigBody'
        created_at:
          title: Created At
          type: string
        version:
          minimum: 1.0
          title: Version
          type: integer
      required:
      - version
      - created_at
      - config
      title: SoulVersionResponse
      type: object
info:
