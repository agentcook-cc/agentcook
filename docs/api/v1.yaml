components:
  schemas:
    AgentDetail:
      properties:
        default:
          title: Default
          type: boolean
        delegates:
          items:
            type: string
          title: Delegates
          type: array
        description:
          title: Description
          type: string
        instance_id:
          title: Instance Id
          type: string
        instructions:
          title: Instructions
          type: string
        max_turns:
          title: Max Turns
          type: integer
        memory:
          title: Memory
          type: boolean
        name:
          title: Name
          type: string
        skills:
          items:
            type: string
          title: Skills
          type: array
        title:
          title: Title
          type: string
        toolkits:
          items:
            type: string
          title: Toolkits
          type: array
        tools:
          items:
            $ref: '#/components/schemas/ToolInfo'
          title: Tools
          type: array
      required:
      - name
      - title
      - description
      - default
      - toolkits
      - skills
      - memory
      - delegates
      - instance_id
      - instructions
      - max_turns
      - tools
      title: AgentDetail
      type: object
    AgentInfo:
      properties:
        default:
          title: Default
          type: boolean
        delegates:
          items:
            type: string
          title: Delegates
          type: array
        description:
          title: Description
          type: string
        instance_id:
          title: Instance Id
          type: string
        memory:
          title: Memory
          type: boolean
        name:
          title: Name
          type: string
        skills:
          items:
            type: string
          title: Skills
          type: array
        title:
          title: Title
          type: string
        toolkits:
          items:
            type: string
          title: Toolkits
          type: array
      required:
      - name
      - title
      - description
      - default
      - toolkits
      - skills
      - memory
      - delegates
      - instance_id
      title: AgentInfo
      type: object
    AgentListResponse:
      properties:
        default_agent:
          title: Default Agent
          type: string
        items:
          items:
            $ref: '#/components/schemas/AgentInfo'
          title: Items
          type: array
      required:
      - items
      - default_agent
      title: AgentListResponse
      type: object
    ChatCancelResponse:
      properties:
        cancelled:
          title: Cancelled
          type: boolean
        run_id:
          title: Run Id
          type: string
      required:
      - run_id
      - cancelled
      title: ChatCancelResponse
      type: object
    ChatResponse:
      description: Non-streaming result of ``POST /api/v1/chat``.
      properties:
        agent:
          title: Agent
          type: string
        content:
          title: Content
          type: string
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        finish_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Finish Reason
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        run_id:
          title: Run Id
          type: string
        session_id:
          title: Session Id
          type: string
        tool_calls:
          items:
            $ref: '#/components/schemas/ToolCallView'
          title: Tool Calls
          type: array
      required:
      - session_id
      - run_id
      - agent
      - content
      title: ChatResponse
      type: object
    ChatStreamRequest:
      additionalProperties: false
      description: Request body for ``POST /api/v1/chat/stream`` and ``POST /api/v1/chat``.
      properties:
        agent:
          anyOf:
          - pattern: ^[a-z][a-z0-9_-]{0,47}$
            type: string
          - type: 'null'
          description: Agent to talk to (see GET /api/v1/agents); defaults to the default agent.
          title: Agent
        max_tokens:
          anyOf:
          - maximum: 128000.0
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Max Tokens
        message:
          description: User message content.
          maxLength: 32000
          minLength: 1
          title: Message
          type: string
        model:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          description: Provider override such as 'qwen:qwen-plus' or 'mock'. Ignored in production.
          title: Model
        plugin_ids:
          description: Extra toolkit ids to enable for this turn (see GET /api/v1/toolkits).
          items:
            type: string
          maxItems: 16
          title: Plugin Ids
          type: array
        session_id:
          description: Conversation id. Created on first use; must belong to the caller.
          pattern: ^[A-Za-z0-9._:-]{1,128}$
          title: Session Id
          type: string
        temperature:
          anyOf:
          - maximum: 2.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Temperature
      required:
      - session_id
      - message
      title: ChatStreamRequest
      type: object
    DelegationEdge:
      additionalProperties: false
      description: A single delegation event from ``from_id`` to ``to_id`` (a reactflow edge).
      properties:
        completed_at:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO-8601 UTC; null while in-flight.
          title: Completed At
        from_id:
          description: Delegator agent id.
          title: From Id
          type: string
        id:
          description: Stable edge identifier.
          title: Id
          type: string
        started_at:
          description: ISO-8601 UTC timestamp.
          title: Started At
          type: string
        status:
          description: Lifecycle state of the delegation.
          enum:
          - pending
          - running
          - succeeded
          - failed
          - cancelled
          title: Status
          type: string
        task:
          description: Short description of the delegated task.
          title: Task
          type: string
        to_id:
          description: Delegate agent id.
          title: To Id
          type: string
      required:
      - id
      - from_id
      - to_id
      - task
      - status
      - started_at
      title: DelegationEdge
      type: object
    DelegationGraphResponse:
      additionalProperties: false
      description: '``GET /api/v1/agents/{agent_id}/delegations`` envelope.'
      properties:
        agent_id:
          description: Root agent the graph is centred on.
          title: Agent Id
          type: string
        edges:
          description: Delegation events, oldest first.
          items:
            $ref: '#/components/schemas/DelegationEdge'
          title: Edges
          type: array
        nodes:
          description: All agents that participated.
          items:
            $ref: '#/components/schemas/DelegationNode'
          title: Nodes
          type: array
      required:
      - agent_id
      - nodes
      - edges
      title: DelegationGraphResponse
      type: object
    DelegationNode:
      additionalProperties: false
      description: One agent in the delegation graph (a reactflow node).
      properties:
        id:
          description: Stable agent identifier within this graph.
          title: Id
          type: string
        name:
          description: Display label.
          title: Name
          type: string
        role:
          description: Agent role (planner / coder / reviewer / ...).
          title: Role
          type: string
      required:
      - id
      - name
      - role
      title: DelegationNode
      type: object
    ErrorEnvelope:
      additionalProperties: false
      description: Flat error shape — matches frontend-conventions §7.6 (B canonical).
      properties:
        code:
          description: Machine-readable error code (UPPER_SNAKE).
          title: Code
          type: string
        detail:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: Optional structured context.
          title: Detail
        message:
          description: Human-readable description.
          title: Message
          type: string
      required:
      - code
      - message
      title: ErrorEnvelope
      type: object
    FlushRequest:
      additionalProperties: false
      properties:
        confirm:
          const: I understand this deletes all events for this agent.
          description: Exact string required to prevent accidental flush.
          title: Confirm
          type: string
        preserve_identity_and_soul:
          default: true
          title: Preserve Identity And Soul
          type: boolean
      required:
      - confirm
      title: FlushRequest
      type: object
    FlushResponse:
      additionalProperties: false
      properties:
        deleted_event_count:
          title: Deleted Event Count
          type: integer
        identity_preserved:
          title: Identity Preserved
          type: boolean
        soul_preserved:
          title: Soul Preserved
          type: boolean
      required:
      - deleted_event_count
      - identity_preserved
      - soul_preserved
      title: FlushResponse
      type: object
    IdentityResponse:
      additionalProperties: false
      properties:
        created_at:
          description: ISO-8601 UTC timestamp
          title: Created At
          type: string
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        name:
          title: Name
          type: string
        role:
          title: Role
          type: string
        scopes:
          items:
            type: string
          title: Scopes
          type: array
      required:
      - name
      - role
      - created_at
      title: IdentityResponse
      type: object
    MemoryEventCreate:
      additionalProperties: false
      description: 'Body for ``POST /agents/{id}/memory/events``.


        Server assigns ``id`` and (if omitted) ``timestamp``.'
      properties:
        content:
          maxLength: 16384
          minLength: 1
          title: Content
          type: string
        kind:
          enum:
          - observation
          - decision
          - tool_use
          - user_input
          - reflection
          title: Kind
          type: string
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
        timestamp:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO-8601 UTC. If omitted, server sets it at write time.
          title: Timestamp
      required:
      - kind
      - content
      title: MemoryEventCreate
      type: object
    MemoryEventListResponse:
      additionalProperties: false
      description: 'Cursor-pagination response.


        Note: per `frontend-conventions §7.6` constraint #5 list endpoints

        should expose ``{items, total, page, size}``. Memory event listing

        intentionally uses **cursor pagination** instead (event streams are

        append-only — page/size becomes unstable as new events arrive).

        Documented exception; flagged in §7 increment to B.'
      properties:
        items:
          items:
            $ref: '#/components/schemas/MemoryEventResponse'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      title: MemoryEventListResponse
      type: object
    MemoryEventResponse:
      additionalProperties: false
      properties:
        content:
          title: Content
          type: string
        id:
          description: String id to avoid enumeration attacks.
          title: Id
          type: string
        kind:
          enum:
          - observation
          - decision
          - tool_use
          - user_input
          - reflection
          title: Kind
          type: string
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
        timestamp:
          title: Timestamp
          type: string
      required:
      - id
      - timestamp
      - kind
      - content
      title: MemoryEventResponse
      type: object
    MemoryHitResponse:
      additionalProperties: false
      properties:
        content:
          title: Content
          type: string
        event:
          anyOf:
          - $ref: '#/components/schemas/MemoryEventResponse'
          - type: 'null'
        score:
          maximum: 1.0
          minimum: 0.0
          title: Score
          type: number
      required:
      - content
      - score
      title: MemoryHitResponse
      type: object
    RenameSessionRequest:
      additionalProperties: false
      properties:
        title:
          maxLength: 200
          minLength: 1
          title: Title
          type: string
      required:
      - title
      title: RenameSessionRequest
      type: object
    SearchRequest:
      additionalProperties: false
      properties:
        query:
          maxLength: 1024
          minLength: 1
          title: Query
          type: string
        top_k:
          default: 5
          maximum: 50.0
          minimum: 1.0
          title: Top K
          type: integer
      required:
      - query
      title: SearchRequest
      type: object
    SearchResponse:
      additionalProperties: false
      properties:
        hits:
          items:
            $ref: '#/components/schemas/MemoryHitResponse'
          title: Hits
          type: array
        query:
          title: Query
          type: string
      required:
      - query
      title: SearchResponse
      type: object
    SessionListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/SessionSummary'
          title: Items
          type: array
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      title: SessionListResponse
      type: object
    SessionSummary:
      properties:
        active_run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Active Run Id
        agent:
          title: Agent
          type: string
        created_at:
          title: Created At
          type: string
        id:
          title: Id
          type: string
        message_count:
          title: Message Count
          type: integer
        title:
          title: Title
          type: string
        updated_at:
          title: Updated At
          type: string
      required:
      - id
      - title
      - agent
      - created_at
      - updated_at
      - message_count
      title: SessionSummary
      type: object
    SkillDetailResponse:
      additionalProperties: false
      description: '``GET /api/v1/skills/{id}`` — adds the skill body (markdown + frontmatter).'
      properties:
        body:
          description: Raw skill body (markdown). Empty for placeholder skills.
          title: Body
          type: string
        category:
          description: Loose grouping (memory / nlp / chat / ...).
          title: Category
          type: string
        description:
          description: One-line summary.
          title: Description
          type: string
        id:
          description: Stable skill identifier (kebab-case).
          title: Id
          type: string
        name:
          description: Display name.
          title: Name
          type: string
        updated_at:
          description: ISO-8601 UTC timestamp of last edit.
          title: Updated At
          type: string
        version:
          description: Semver string from the skill manifest.
          title: Version
          type: string
      required:
      - id
      - name
      - description
      - version
      - category
      - updated_at
      - body
      title: SkillDetailResponse
      type: object
    SkillListResponse:
      additionalProperties: false
      description: Envelope for the skill list endpoint.
      properties:
        items:
          description: Skills, ordered as the registry yields them.
          items:
            $ref: '#/components/schemas/SkillSummary'
          title: Items
          type: array
        total:
          description: Total count — equals ``len(items)`` until pagination lands.
          title: Total
          type: integer
      required:
      - items
      - total
      title: SkillListResponse
      type: object
    SkillSummary:
      additionalProperties: false
      description: One row in ``GET /api/v1/skills`` — what B's SkillListView shows.
      properties:
        category:
          description: Loose grouping (memory / nlp / chat / ...).
          title: Category
          type: string
        description:
          description: One-line summary.
          title: Description
          type: string
        id:
          description: Stable skill identifier (kebab-case).
          title: Id
          type: string
        name:
          description: Display name.
          title: Name
          type: string
        updated_at:
          description: ISO-8601 UTC timestamp of last edit.
          title: Updated At
          type: string
        version:
          description: Semver string from the skill manifest.
          title: Version
          type: string
      required:
      - id
      - name
      - description
      - version
      - category
      - updated_at
      title: SkillSummary
      type: object
    SkillTestRequest:
      additionalProperties: false
      description: 'Body for ``POST /api/v1/skills/{id}/test/stream``.


        The ``input`` is whatever the SkillTestDialog''s textarea contains;

        structured ``args`` may be added later (Phase 5 once real skill

        schemas are loaded). Today the SSE mock ignores ``args`` and just

        echoes ``input`` back through the streamed chunks.'
      properties:
        args:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: Optional structured args (Phase 5).
          title: Args
        input:
          description: Free-form test input the skill will receive.
          title: Input
          type: string
      required:
      - input
      title: SkillTestRequest
      type: object
    SoulConfigBody:
      additionalProperties: false
      properties:
        custom_traits:
          additionalProperties:
            type: string
          title: Custom Traits
          type: object
        language_style:
          default: concise
          title: Language Style
          type: string
        tone:
          default: neutral
          title: Tone
          type: string
        values:
          items:
            type: string
          title: Values
          type: array
      title: SoulConfigBody
      type: object
    SoulHistoryResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/SoulVersionResponse'
          title: Items
          type: array
      title: SoulHistoryResponse
      type: object
    SoulResponse:
      additionalProperties: false
      description: Returned with the persisted version (echoes input on POST).
      properties:
        custom_traits:
          additionalProperties:
            type: string
          title: Custom Traits
          type: object
        language_style:
          default: concise
          title: Language Style
          type: string
        tone:
          default: neutral
          title: Tone
          type: string
        values:
          items:
            type: string
          title: Values
          type: array
      title: SoulResponse
      type: object
    SoulVersionResponse:
      additionalProperties: false
      description: A single point in the per-agent soul history.
      properties:
        config:
          $ref: '#/components/schemas/SoulConfigBody'
        created_at:
          title: Created At
          type: string
        version:
          minimum: 1.0
          title: Version
          type: integer
      required:
      - version
      - created_at
      - config
      title: SoulVersionResponse
      type: object
    ToolCallView:
      description: A tool call as rendered in the chat UI.
      properties:
        arguments:
          additionalProperties: true
          title: Arguments
          type: object
        duration_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Duration Ms
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        id:
          title: Id
          type: string
        name:
          title: Name
          type: string
        output:
          anyOf:
          - type: string
          - type: 'null'
          title: Output
        status:
          enum:
          - running
          - success
          - error
          title: Status
          type: string
        turn:
          anyOf:
          - type: integer
          - type: 'null'
          title: Turn
      required:
      - id
      - name
      - status
      title: ToolCallView
      type: object
    ToolInfo:
      properties:
        description:
          title: Description
          type: string
        name:
          title: Name
          type: string
        parameters:
          additionalProperties: true
          title: Parameters
          type: object
      required:
      - name
      - description
      title: ToolInfo
      type: object
    ToolkitInfo:
      properties:
        description:
          title: Description
          type: string
        id:
          title: Id
          type: string
        name:
          title: Name
          type: string
        tools:
          items:
            $ref: '#/components/schemas/ToolInfo'
          title: Tools
          type: array
      required:
      - id
      - name
      - description
      - tools
      title: ToolkitInfo
      type: object
    ToolkitListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ToolkitInfo'
          title: Items
          type: array
      required:
      - items
      title: ToolkitListResponse
      type: object
    TranscriptMessage:
      description: 'A transcript entry. Tool results are folded into ``tool_calls`` of

        the assistant message that requested them, matching the live UI.'
      properties:
        content:
          title: Content
          type: string
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
        id:
          title: Id
          type: string
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        role:
          enum:
          - user
          - assistant
          title: Role
          type: string
        tool_calls:
          items:
            $ref: '#/components/schemas/ToolCallView'
          title: Tool Calls
          type: array
      required:
      - id
      - role
      - content
      title: TranscriptMessage
      type: object
    TranscriptResponse:
      properties:
        messages:
          items:
            $ref: '#/components/schemas/TranscriptMessage'
          title: Messages
          type: array
        session:
          $ref: '#/components/schemas/SessionSummary'
      required:
      - session
      - messages
      title: TranscriptResponse
      type: object
info:
  description: "Agent runtime for AgentCook: a streaming agent loop with tools, skills,\nsub-agent delegation, conversation\
    \ transcripts and long-term memory.\n\n* **Chat** — `POST /api/v1/chat/stream` runs one agent turn and streams\n  typed\
    \ frames (text deltas, tool calls, tool results, usage).\n* **Conversations** — transcripts per user, replayed on every\
    \ turn.\n* **Agents / toolkits / skills** — what the runtime can do, as data.\n* **Memory** — identity / soul / long-term\
    \ memory per agent instance.\n\nAuthentication: `Authorization: Bearer <JWT>` issued by agentcook-java\n(ADR-013). Errors\
    \ use the `{code, message, detail}` envelope.\n"
  title: agentcook runtime
  version: 2.0.0
  x-changelog: docs/api/CHANGELOG.md
  x-frozen: '2026-10-14'
  x-paired-spec: docs/api/java-v1.yaml
  x-scope: python-runtime
openapi: 3.1.0
paths:
  /api/v1/agents:
    get:
      operationId: list_agents_api_v1_agents_get
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema: &id001
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Request validation failed.
      summary: List available agents
      tags:
      - agents
  /api/v1/agents/{agent_id}/delegations:
    get:
      operationId: get_delegations_api_v1_agents__agent_id__delegations_get
      parameters:
      - in: path
        name: agent_id
        required: true
        schema:
          pattern: ^[A-Za-z0-9_\-]{1,64}$
          title: Agent Id
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 500
          minimum: 1
          title: Limit
          type: integer
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegationGraphResponse'
          description: Successful Response
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Agent not found
        '422':
          content:
            application/json:
              schema: *id001
          description: Request validation failed.
      summary: Delegation graph for one agent (catalog topology + recent delegations)
      tags:
      - delegations
  /api/v1/agents/{agent_id}/identity:
    get:
      operationId: get_identity_api_v1_agents__agent_id__identity_get
      parameters:
      - description: Agent identifier
        in: path
        name: agent_id
        required: true
        schema:
          description: Agent identifier
          pattern: ^[A-Za-z0-9_\-]{1,64}$
          title: Agent Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Malformed request body (e.g. invalid JSON).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing or invalid access token.
        '403':
