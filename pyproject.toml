[project]
name = "agentcook-workspace"
version = "0.1.0"
description = "agentcook Python workspace"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.uv.workspace]
members = [
    "agentcook-core",
    "agentcook-providers",
    "agentcook-storage",
    "agentcook",
    "agentcook-swarm",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres,redis]>=4.7",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "pact-python>=2.2,<3",
    "fastapi>=0.110",
    "httpx>=0.27",
    "ruff>=0.15.13",
    "locust>=2.44.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.coverage.run]
branch = true
source = [
    "agentcook-core/src/agentcook_core",
    "agentcook-providers/src/agentcook_providers",
    "agentcook-storage/src/agentcook_storage",
    "agentcook/src/agentcook_app",
]
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
show_missing = true
skip_covered = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests",
    "tests/contract",
    "agentcook-core/tests",
    "agentcook-providers/tests",
    "agentcook-storage/tests",
    "agentcook/tests",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
markers = [
    "unit: fast tests with no external deps",
    "integration: tests requiring testcontainers (Docker daemon)",
    "contract: Pact consumer/provider contract tests (requires pact-broker on :9292)",
    "slow: tests that take >5s",
]
asyncio_mode = "auto"
